  liquid_glass_easy: 4.3.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
