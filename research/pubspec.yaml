name: liquid_prism_research
description: Research harnesses, benchmarks and native parity fixtures for Liquid Prism.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  liquid_glass_easy: 4.3.0
  liquid_prism:
    path: ..
  liquid_prism_example:
    path: ../example

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - probes/hdr_probe/probe.frag
