name: liquid_prism
description: Liquid glass components and native iOS popup menus, with customizable Flutter shaders and spring-driven controls.
version: 0.17.0
repository: https://github.com/rehmatsg/liquid_prism
issue_tracker: https://github.com/rehmatsg/liquid_prism/issues
topics:
  - liquid-glass
  - widgets
  - shaders
  - animation
  - ios

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidPrismPlugin
  shaders:
    - shaders/frost_fill.frag
    - shaders/edge_blur.frag
    - shaders/glass.frag
    - shaders/glass_batch.frag
    - shaders/refresh.frag
    - shaders/tab_content.frag
