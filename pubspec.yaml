name: liquid_prism
description: Liquid glass components and native iOS popup menus, with customizable Flutter shaders and spring-driven controls.
version: 0.4.0
repository: https://github.com/rehmatsg/liquid_prism
issue_tracker: https://github.com/rehmatsg/liquid_prism/issues
topics:
  - liquid-glass
  - widgets
  - shaders
  - animation
  - ios

environment:
  sdk: ^3.13.3
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidPrismPlugin
  shaders:
    - shaders/edge_blur.frag
    - shaders/edge_haze.frag
    - shaders/glass.frag
    - shaders/glass_batch.frag
    - shaders/tab_content.frag
