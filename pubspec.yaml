name: liquid_prism
description: Liquid glass surfaces, buttons, and spring-driven tab bars with native iOS materials and customizable Flutter shaders.
version: 0.1.0
repository: https://github.com/rehmatsg/liquid_prism
issue_tracker: https://github.com/rehmatsg/liquid_prism/issues
topics:
  - liquid-glass
  - widgets
  - shaders
  - animation
  - ios

environment:
  sdk: ^3.13.3
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidPrismPlugin
  shaders:
    - shaders/glass.frag
    - shaders/glass_batch.frag
