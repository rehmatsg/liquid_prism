name: ControlSpecs
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  ControlSpecs:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.prism.controlspec
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Extractor.h
  ControlSpecsTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ControlSpecs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.prism.controlspec.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ControlSpecs:
    build:
      targets:
        ControlSpecs: all
        ControlSpecsTests: [test]
    test:
      targets: [ControlSpecsTests]
