name: DispersionSpecs
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  DispersionSpecs:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.prism.dispersionspec
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Extractor.h
  DispersionSpecsTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DispersionSpecs
    settings:
      base:
        # Device runs without an Xcode account can only reuse an existing
        # team profile: tool/glass_parity passes
        # PARITY_TESTS_BUNDLE_ID=dev.prism.nativeShowcase.tests.
        PARITY_TESTS_BUNDLE_ID: dev.prism.dispersionspec.tests
        PRODUCT_BUNDLE_IDENTIFIER: $(PARITY_TESTS_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DispersionSpecs:
    build:
      targets:
        DispersionSpecs: all
        DispersionSpecsTests: [test]
    test:
      targets: [DispersionSpecsTests]
