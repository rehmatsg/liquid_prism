name: NativeShowcase
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  NativeShowcase:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rehmat.glassshowcase.native
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prism Native
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  NativeShowcaseTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies: [{target: NativeShowcase}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.prism.nativeShowcase.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NativeShowcase:
    build:
      targets:
        NativeShowcase: all
        NativeShowcaseTests: [test]
    test:
      targets: [NativeShowcaseTests]
