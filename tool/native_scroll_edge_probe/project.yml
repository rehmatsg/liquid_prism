name: ScrollEdgeSpecs
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  ScrollEdgeSpecs:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.prism.scrolledgespec
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Extractor.h
  ScrollEdgeSpecsTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ScrollEdgeSpecs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.prism.scrolledgespec.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScrollEdgeSpecs:
    build:
      targets:
        ScrollEdgeSpecs: all
        ScrollEdgeSpecsTests: [test]
    test:
      targets: [ScrollEdgeSpecsTests]
