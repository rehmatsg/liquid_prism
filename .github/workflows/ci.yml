name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
          requireScope: false

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: ./tool/check.sh
      - run: dart doc --dry-run
      - run: flutter test --coverage --timeout=30s
      - run: flutter pub publish --dry-run

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Run Swift unit tests
        run: |
          SIM=$(xcrun simctl list devices available iPhone --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data.keys(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for dev in data[runtime]:
                  if dev.get('isAvailable'):
                      print(dev['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          xcodebuild test -scheme liquid_prism-Package -destination "platform=iOS Simulator,id=$SIM"
      - name: Validate CocoaPods podspec
        run: pod ipc spec ios/liquid_prism.podspec > /dev/null
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
        working-directory: example

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: example
